
services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "060307"
      POSTGRES_DB: laundrydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springboot-postgres-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: poojitha32019/docker-backend-2400032019:latest
    container_name: laundry-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/laundrydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "060307"
    ports:
      - "8080:8080"
    depends_on:
      - postgresdb
    restart: on-failure
    networks:
      - springboot-postgres-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: poojitha32019/docker-frontend-2400032019:latest
    container_name: laundry-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - springboot-postgres-net

volumes:
  postgres_data:

networks:
  springboot-postgres-net:
